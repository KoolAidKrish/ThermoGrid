# Activated with SPRING_PROFILES_ACTIVE=postgres (docker-compose.yml does this).
# Defaults match the local Compose database; override with the env vars for anything else.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/thermogrid}
spring.datasource.username=${DB_USER:thermogrid}
spring.datasource.password=${DB_PASSWORD:thermogrid}

spring.application.name=thermogrid

spring.datasource.url=jdbc:h2:mem:thermogrid;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false

thermogrid.heat-threshold=30
thermogrid.per-capita-demand-kw=1.0
thermogrid.demand-growth-per-degree=0.03
thermogrid.derate-per-degree=0.01
thermogrid.min-capacity-factor=0.5

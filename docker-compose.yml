# ThermoGrid on PostgreSQL: `docker compose up --build`, then http://localhost:8080.
# Change the host port with THERMOGRID_PORT=8081 if 8080 is taken.
# Credentials are local-development defaults, not secrets.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: thermogrid
      POSTGRES_USER: thermogrid
      POSTGRES_PASSWORD: thermogrid
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermogrid -d thermogrid"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/thermogrid
      DB_USER: thermogrid
      DB_PASSWORD: thermogrid
    ports:
      - "${THERMOGRID_PORT:-8080}:8080"

volumes:
  pgdata:

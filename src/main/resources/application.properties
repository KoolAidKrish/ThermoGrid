spring.application.name=thermogrid

# Default: in-memory H2, so the app runs with nothing installed.
# Run with the "postgres" profile to use PostgreSQL instead (see application-postgres.properties).
spring.datasource.url=jdbc:h2:mem:thermogrid;DB_CLOSE_DELAY=-1
spring.jpa.open-in-view=false

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks
# that the entities match it, and fails at startup if they drift.
spring.jpa.hibernate.ddl-auto=validate

thermogrid.heat-threshold=30
thermogrid.per-capita-demand-kw=1.0
thermogrid.demand-growth-per-degree=0.03
thermogrid.derate-per-degree=0.01
thermogrid.min-capacity-factor=0.5
